<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SECURE TERMINAL - ACCESS RESTRICTED</title>
    <style>
        body {
            background-color: #050505;
            color: #00ff66;
            font-family: 'Courier New', Courier, monospace;
            padding: 20px;
            margin: 0;
            overflow-x: hidden;
        }
        .terminal {
            max-width: 800px;
            margin: auto;
            border: 1px solid #00ff66;
            padding: 20px;
            box-shadow: 0 0 15px rgba(0, 255, 102, 0.2);
            background: rgba(0, 0, 0, 0.9);
        }
        h2 { color: #ff0055; text-align: center; }
        .line { margin: 5px 0; }
        .highlight { color: #ffff00; }
        .warning { color: #ff3333; font-weight: bold; }
    </style>
</head>
<body>
    <div class="terminal">
        <h2>[!] CIA-SECURE GATEWAY v4.8 [!]</h2>
        <div id="output"></div>
    </div>

    <script>
        const output = document.getElementById('output');
        
        // جلب بيانات الجهاز الأساسية من متصفح الزائر
        const userAgent = navigator.userAgent;
        const platform = navigator.platform;
        const screenRes = window.screen.width + 'x' + window.screen.height;
        const language = navigator.language;

        const logs = [
            "[+] Initializing secure handshake...",
            "[+] Bypassing firewall and proxy layers...",
            "[+] Target connection detected successfully.",
            "[+] Extracting system fingerprints...",
            "--------------------------------------------------",
            "[*] Client Platform: " + platform,
            "[*] Browser Engine: " + userAgent,
            "[*] Screen Resolution: " + screenRes,
            "[*] System Language: " + language,
            "--------------------------------------------------",
            "[!] WARNING: UNAUTHORIZED ACCESS ATTEMPT LOGGED.",
            "[!] GEOLOCATION AND HARDWARE SIGNATURE RECORDED.",
            "[✔] Session secured. Connection closed."
        ];

        let index = 0;
        function typeLine() {
            if (index < logs.length) {
                const div = document.createElement('div');
                div.className = 'line';
                if(logs[index].includes("WARNING")) div.className += " warning";
                else if(logs[index].includes("*")) div.className += " highlight";
                
                div.textContent = logs[index];
                output.appendChild(div);
                index++;
                setTimeout(typeLine, 350); // سرعة كتابة النصوص
            }
        }

        window.onload = typeLine;
    </script>
</body>
</html>
